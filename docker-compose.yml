services:
  wavelog-awtrix:
    image: ghcr.io/hochdruckhummer/wavelogqsostats2awtrix:latest
    container_name: wavelog-awtrix
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Login for the web UI (user "admin") – change this password!
      WEB_PASSWORD: "change-me"
    volumes:
      # config.json is stored in ./data on the host
      - ./data:/app/data
